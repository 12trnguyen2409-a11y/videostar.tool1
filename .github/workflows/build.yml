name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and Dependencies
        run: |
          # Tải Theos
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

          # Cài ldid trực tiếp (tránh lỗi brew update)
          curl -L https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64 -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid

          # Cài dpkg trực tiếp
          curl -L http://mirrors.kernel.org/ubuntu/pool/main/d/dpkg/dpkg_1.19.0.5ubuntu2_amd64.deb -o dpkg.deb
          ar x dpkg.deb
          tar -xf data.tar.xz
          sudo cp ./usr/bin/dpkg-deb /usr/local/bin/

      - name: Build Tweak
        run: |
          make clean
          make

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarTool-Dylib
          path: .theos/obj/debug/*.dylib
