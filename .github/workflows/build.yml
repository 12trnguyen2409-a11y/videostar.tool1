name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          brew install ldid xz dpkg

      - name: Build Tweak
        run: |
          make clean
          make

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarTool-Dylib
          path: .theos/obj/debug/*.dylib
